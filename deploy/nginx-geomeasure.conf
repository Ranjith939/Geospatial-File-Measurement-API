# I use this as the reverse proxy in front of gunicorn (docker compose or the systemd unit next to this file).
# The body limit is a bit higher than MAX_UPLOAD_MB on purpose, so the app sends its own 413 JSON error instead of nginx.
server {
    listen 80;
    server_name _;
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}
