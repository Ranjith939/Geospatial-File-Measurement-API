# Reverse proxy in front of gunicorn (docker compose or the systemd unit next to this file).
# The body limit sits a little above MAX_UPLOAD_MB so the app returns its own 413 JSON error.
server {
    listen 80;
    server_name _;
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}
