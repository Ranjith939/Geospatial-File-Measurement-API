[pytest]
DJANGO_SETTINGS_MODULE = geomeasure.test_settings
# Unit + API suites live next to their apps; the Playwright browser suite is e2e/.
testpaths = processing api e2e
python_files = test_*.py
# Screenshots and traces are kept only when a browser test fails.
addopts = --screenshot=only-on-failure --tracing=retain-on-failure -p no:cacheprovider
