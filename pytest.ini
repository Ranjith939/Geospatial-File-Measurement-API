[pytest]
DJANGO_SETTINGS_MODULE = geomeasure.test_settings
# The unit and API tests sit next to their apps, and the Playwright browser tests are in e2e/.
testpaths = processing api e2e
python_files = test_*.py
# I only keep screenshots and traces when a browser test fails.
addopts = --screenshot=only-on-failure --tracing=retain-on-failure -p no:cacheprovider
