name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "ci-not-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      # In production the static filenames get hashed, so I run collectstatic here. It breaks if a
      # vendor file points (url() or import) at something we never shipped.
      - name: Static files collect cleanly
        run: python manage.py collectstatic --noinput
      - name: Unit + API tests
        run: python -m pytest processing api
      - run: python -m playwright install --with-deps chromium
      - name: Playwright E2E (headless)
        run: python -m pytest e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t geomeasure .
